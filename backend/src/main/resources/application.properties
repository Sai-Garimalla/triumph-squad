# Server Configuration
server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/order_platform?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Concurrency Thread Pool Settings
app.threadpool.core-pool-size=10
app.threadpool.max-pool-size=25
app.threadpool.queue-capacity=500
app.threadpool.thread-name-prefix=OrderWorker-

# Retry Settings
app.retry.max-attempts=3
app.retry.delay-ms=250
